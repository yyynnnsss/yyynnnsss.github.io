<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>鸡汤合集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#12141d;
  color:#f0f0f0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  padding:16px;
  padding-bottom:80px;
}
h1{
  text-align:center;
  margin:12px 0 16px;
  font-size:22px;
  color:#ff7b89;
}
/* 横向可滑动标签栏 */
.tab-wrap{
  display:none;
  gap:10px;
  overflow-x:auto;
  overflow-y:hidden;
  padding-bottom:10px;
  margin-bottom:16px;
  scrollbar-width:none;
}
.tab-wrap::-webkit-scrollbar{
  display:none;
}
.tab-item{
  flex-shrink:0;
  padding:8px 16px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
  font-size:14px;
  cursor:pointer;
  border:1px solid transparent;
}
.tab-item.active{
  background:#ff7b89;
  border-color:#ff949e;
}
.item{
  background:rgba(255,255,255,0.06);
  border-radius:12px;
  padding:16px 18px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,0.08);
  line-height:1.7;
  font-size:15px;
}
.poem-content{
  font-size:17px;
  margin-bottom:6px;
}
.poem-info{
  font-size:14px;
  color:#b0b8d4;
}
.poem-cate{
  font-size:12px;
  color:#888fa8;
  margin-top:4px;
}
.loading{
  text-align:center;
  padding:20px;
  color:#aaa;
}
.no-more{
  text-align:center;
  padding:20px;
  color:#777;
}
.error-tip{
  text-align:center;
  padding:20px;
  color:#ff8888;
}
#sentinel{
  height:1px;
  margin-top:10px;
}
</style>
</head>
<body>
<h1>💬鸡汤合集</h1>
<div class="tab-wrap">
  <div class="tab-item active" data-type="dujitang">毒鸡汤</div>
  <div class="tab-item" data-type="gushi">古诗词</div>
</div>

<div id="listWrap">
    <div class="loading">鸡汤正在熬制中...</div>
</div>
<div id="sentinel"></div>

<script>
const apiConfig = {
  dujitang:{
    url:"https://jkapi.com/api/dujitang",
    name:"毒鸡汤",
    parse:"text",
    pageSize:12
  },
  gushi:{
    url:"xkw.html",
    name:"古诗词",
    parse:"v1jinrishici",
    pageSize:6
  }
};

const MAX_TRY_PER_ITEM = 15;
const listWrap = document.getElementById("listWrap");
const sentinel = document.getElementById("sentinel");

let isLoading = false;
let currentType = "dujitang";
const existedMap = {};
Object.keys(apiConfig).forEach(key=>{
  existedMap[key] = new Set();
})

let observer = null;

//HTML转义
function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

async function fetchOne(type){
  const cfg = apiConfig[type];
  const res = await fetch(cfg.url);
  if(!res.ok) throw new Error(`HTTP错误 ${res.status}`);

  if(cfg.parse === "text"){
    const text = await res.text();
    return { type:"text", content:text.trim() };
  }else if(cfg.parse === "v1jinrishici"){
    const json = await res.json();
    return {
      type:"poem",
      raw:json
    };
  }
}

//获取一条不重复数据
async function getUniqueOne(type){
  let tryCount = 0;
  while(tryCount < MAX_TRY_PER_ITEM){
    const resObj = await fetchOne(type);
    let key;
    if(resObj.type === "text"){
      key = resObj.content.trim();
    }else{
      key = resObj.raw.content.trim();
    }
    if(key && !existedMap[type].has(key)){
      existedMap[type].add(key);
      return resObj;
    }
    tryCount++;
  }
  return null;
}

async function loadMore(){
  if(isLoading) return;
  isLoading = true;
  showLoading(true);
  const count = apiConfig[currentType].pageSize;
  try{
    const resultList = [];
    while(resultList.length < count){
      const item = await getUniqueOne(currentType);
      if(item === null) break;
      resultList.push(item);
    }
    if(resultList.length >0){
      appendItems(resultList);
    }else{
      showNoMore(true);
    }
  }catch(err){
    console.error(err);
    showError(`加载失败：${err.message}`);
  }finally{
    showLoading(false);
    isLoading = false;
  }
}

function appendItems(arr){
  const frag = document.createDocumentFragment();
  arr.forEach(obj=>{
    const div = document.createElement("div");
    div.className = "item";
    if(obj.type === "text"){
      div.innerText = obj.content;
    }else if(obj.type === "poem"){
      const raw = obj.raw;
      div.innerHTML = `
        <div class="poem-content">${escapeHtml(raw.content||"")}</div>
        <div class="poem-info">——${escapeHtml(raw.author||"")}《${escapeHtml(raw.origin||"")}》</div>
        <div class="poem-cate">分类：${escapeHtml(raw.category||"")}</div>
      `;
    }
    frag.appendChild(div);
  });
  listWrap.appendChild(frag);
}

function showLoading(show){
  let el = document.querySelector(".loading");
  if(show){
    if(!el){
      el = document.createElement("div");
      el.className="loading";
      el.innerText="加载中…";
      sentinel.before(el);
    }
  }else{
    if(el) el.remove();
  }
}

function showNoMore(show){
  let el = document.querySelector(".no-more");
  if(show){
    if(!el){
      el = document.createElement("div");
      el.className="no-more";
      el.innerText="暂时没有更多新内容";
      sentinel.before(el);
    }
    if(observer) observer.disconnect();
  }else{
    if(el) el.remove();
  }
}

//显示错误提示
function showError(msg){
  let el = document.querySelector(".error-tip");
  if(!el){
    el = document.createElement("div");
    el.className="error-tip";
    sentinel.before(el);
  }
  el.innerText = msg;
}

function resetObserver(){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver((entries)=>{
    const entry = entries[0];
    if(entry.isIntersecting){
      loadMore();
    }
  },{rootMargin:"300px 0px",threshold:0});
  observer.observe(sentinel);
}

//切换标签
function switchTab(newType){
  if(currentType === newType) return;
  currentType = newType;
  document.querySelectorAll(".tab-item").forEach(t=>t.classList.remove("active"));
  document.querySelector(`.tab-item[data-type="${newType}"]`).classList.add("active");
  listWrap.innerHTML = "";
  showLoading(false);
  showNoMore(false);
  //清除旧错误
  const errEl = document.querySelector(".error-tip");
  if(errEl) errEl.remove();
  resetObserver();
  loadMore();
}

document.querySelectorAll(".tab-item").forEach(tab=>{
  tab.onclick = function(){
    const t = this.getAttribute("data-type");
    switchTab(t);
  }
})

// ✅关键修复：等待DOM全部加载完成再执行初始化
document.addEventListener("DOMContentLoaded", async function(){
  resetObserver();
  listWrap.innerHTML = `<div class="loading">正在加载毒鸡汤...</div>`;
  await loadMore();
});
</script>
</body>
</html>
