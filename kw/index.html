<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KW解析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
html,body{
  height:100%;
  height:100dvh;
  overflow:hidden;
  background: #121212;
  color:#fff;
}
.wrap{
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
  width:100%;
}
.search-wrap{
  flex:0 0 auto;
  display:flex;
  gap:6px;
  padding:12px;
  width:100%;
}
#inputBox{
  flex:1 1 auto;
  min-width:0;
  padding:12px 14px;
  border-radius:30px;
  border:none;
  background:#222;
  color:#fff;
  font-size:16px;
  outline:none;
  text-align:center;
}
#parseBtn{
  padding:0 12px;
  border:none;
  border-radius:30px;
  background:#2593fc;
  color:#fff;
  font-size:14px;
  cursor:pointer;
  white-space:nowrap;
  min-height:44px;
  flex-shrink:0;
}
#parseBtn:active{opacity:0.8}
#toggleSideBtn{
  padding:0 10px;
  border:none;
  border-radius:30px;
  background:#444;
  color:#fff;
  cursor:pointer;
  white-space:nowrap;
  min-height:44px;
  font-size:14px;
  flex-shrink:0;
}
#toggleSideBtn:active{opacity:0.85;}

/* 固定歌曲链接区域：输入框下方，不参与滚动 */
.audio-url-fixed-wrap{
  flex:0 0 auto;
  padding:0 12px 8px;
  width:100%;
  display:none;
}
#audioUrlBox{
  max-width:620px;
  margin:0 auto;
  width:100%;
  font-size:12px;
  color:#999;
  word-break:break-all;
  background:#2a2a2a;
  padding:8px;
  border-radius:8px;
}

/* ========== 历史侧边栏 响应式 ========== */
.history-sidebar{
  position:fixed;
  top:0;
  left:0;
  height:100%;
  height:100dvh;
  width:25vw;
  max-width:320px;
  min-width:220px;
  background:#1a1a1a;
  border-right:1px solid #333;
  z-index:999;
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  padding:16px;
  display:flex;
  flex-direction:column;
}
.history-sidebar.open{
  transform: translateX(0);
}
@media (max-width:768px){
  .history-sidebar{
    width:85vw;
    max-width:none;
  }
}
.side-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  gap:8px;
}
.side-header h3{
  font-size:16px;
  color:#eee;
}
#sideClearHistory{
  color:#ff6b6b;
  font-size:14px;
  cursor:pointer;
  white-space:nowrap;
}
#sideCloseBtn{
  color:#aaa;
  cursor:pointer;
  font-size:22px;
  margin-left:8px;
}
.side-history-wrap{
  flex:1;
  overflow-y:auto;
}
.side-history-item{
  padding:12px 6px;
  border-bottom:1px solid #303030;
  cursor:pointer;
  color:#ccc;
  font-size:14px;
  min-height:44px;
}
.side-history-item:hover{
  color:#fff;
  background:#272727;
}
.side-empty{
  text-align:center;
  color:#777;
  padding:30px 0;
}

/* 主内容区域，页面无外层滚动 */
.main-content{
  flex:1;
  min-height:0;
  width:100%;
  padding:0 12px;
  overflow:hidden;
}
.container{
  max-width:620px;
  margin:0 auto;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.info-card{
  background:#1e1e1e;
  border-radius:16px;
  padding:16px;
  display:none;
  flex-direction:column;
  flex:1;
  min-height:0;
  width:100%;
}
.lyric-box{
  flex:1;
  min-height:0;
  background:#222;
  border-radius:12px;
  padding:12px;
  overflow:hidden;
  position:relative;
}
.lyric-wrap{
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling: touch;
}
.lyric-line{
  text-align:center;
  padding:10px 0;
  color:#aaa;
  font-size:15px;
  cursor:pointer;
}
.lyric-line.active{
  color:#fff;
  font-size:17px;
  font-weight:bold;
}

/* ==========底部按钮【在播放器上方】========== */
.fixed-bottom-bar{
  position:fixed;
  bottom: calc(70px + env(safe-area-inset-bottom));
  left:0;
  width:100%;
  padding:10px 12px;
  background:#121212;
  display:none;
  z-index:99;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}
.btn-row{
  display:flex;
  gap:8px;
  max-width:620px;
  margin:0 auto;
  width:100%;
}
.dl-btn,.copy-url-btn,.loop-btn{
  flex:1;
  padding:12px 4px;
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:14px;
  cursor:pointer;
  min-height:44px;
}
.loop-btn{
  background:#f39c12;
}
.dl-btn{
  background:#27ae60;
}
.copy-url-btn{
  background:#9b59b6;
}
.dl-btn:active,.copy-url-btn:active,.loop-btn:active{opacity:0.8}

/* ==========播放器【在按钮的下方】========== */
#audioPlayer{
  position:fixed;
  bottom: calc(10px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:620px;
  z-index:98;
  display:none;
}

.loading{
  text-align:center;
  padding:30px;
  font-size:16px;
  color:#ccc;
}
.error{
  color:#ff5555;
  text-align:center;
  padding:20px;
}

@media (max-width:480px){
  .search-wrap{
    gap:6px;
    padding:10px;
  }
  #inputBox{
    padding:11px 12px;
    font-size:15px;
  }
  .info-card{
    padding:12px;
  }
  .btn-row{
    gap:6px;
  }
  .dl-btn,.copy-url-btn,.loop-btn{
    font-size:13px;
    padding:10px 2px;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <!-- 顶部搜索 -->
  <div class="search-wrap">
    <button id="toggleSideBtn">📜历史</button>
    <input id="inputBox" placeholder="KW音乐ID/分享的链接">
    <button id="parseBtn">解析</button>
  </div>

  <!-- ✅歌曲链接固定区域：输入框下方，不参与页面滚动 -->
  <div class="audio-url-fixed-wrap" id="audioUrlWrap">
    <div id="audioUrlBox"></div>
  </div>

  <div class="history-sidebar" id="historySidebar">
    <div class="side-header">
      <h3>历史</h3>
      <div>
        <span id="sideClearHistory">清空</span>
        <span id="sideCloseBtn">◀||</span>
      </div>
    </div>
    <div class="side-history-wrap" id="sideHistoryContent">
    </div>
  </div>

  <div class="main-content">
    <div class="container">
      <div id="loadingBox" class="loading" style="display:none;">正在解析...</div>
      <div id="errorBox" class="error" style="display:none;"></div>
      <div id="infoCard" class="info-card">
        <div class="lyric-box">
          <div class="lyric-wrap" id="lyricWrap"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 【顺序：1.三个按钮（播放器上方）】 -->
  <div class="fixed-bottom-bar" id="bottomBar">
    <div class="btn-row">
      <button id="loopBtn" class="loop-btn">循环</button>
      <button id="downloadBtn" class="dl-btn">下载</button>
      <button id="copyUrlBtn" class="copy-url-btn">链接</button>
    </div>
  </div>

  <!-- 【顺序：2.播放器（按钮下方）】 -->
  <audio id="audioPlayer" controls>

</div>
<script>
const inputBox = document.getElementById('inputBox');
const parseBtn = document.getElementById('parseBtn');
const infoCard = document.getElementById('infoCard');
const loadingBox = document.getElementById('loadingBox');
const errorBox = document.getElementById('errorBox');
const audioUrlBox = document.getElementById('audioUrlBox');
const audioUrlWrap = document.getElementById('audioUrlWrap');
const audioPlayer = document.getElementById('audioPlayer');
const downloadBtn = document.getElementById('downloadBtn');
const copyUrlBtn = document.getElementById('copyUrlBtn');
const lyricWrap = document.getElementById('lyricWrap');
const loopBtn = document.getElementById('loopBtn');
const bottomBar = document.getElementById('bottomBar');

const toggleSideBtn = document.getElementById('toggleSideBtn');
const historySidebar = document.getElementById('historySidebar');
const sideHistoryContent = document.getElementById('sideHistoryContent');
const sideClearHistory = document.getElementById('sideClearHistory');
const sideCloseBtn = document.getElementById('sideCloseBtn');

let songUrl = "";
let lyricList = [];
let isSingleLoop = true;
let isUserScrolling = false;
let scrollTimer = null;
const HISTORY_KEY = "kuwo_music_history";
const MAX_HISTORY = 20;

toggleSideBtn.onclick = ()=>{
  historySidebar.classList.toggle('open');
  renderSideHistory();
};
sideCloseBtn.onclick = ()=>{
  historySidebar.classList.remove('open');
};

//监听歌词容器滚动
lyricWrap.addEventListener('scroll',()=>{
  isUserScrolling = true;
  clearTimeout(scrollTimer);
});
lyricWrap.addEventListener('scrollend',()=>{
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(()=>{
    isUserScrolling = false;
  },800);
});

loopBtn.onclick = ()=>{
  isSingleLoop = !isSingleLoop;
  loopBtn.textContent = isSingleLoop ? "循环" : "不循环";
};
audioPlayer.addEventListener('ended', ()=>{
  if(isSingleLoop){
    audioPlayer.currentTime = 0;
    audioPlayer.play().catch(e=>{});
  }
});

function getHistory(){
  const str = localStorage.getItem(HISTORY_KEY);
  return str ? JSON.parse(str) : [];
}
function saveHistory(list){
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
}
function addHistory(itemId){
  let list = getHistory();
  list = list.filter(i=>i !== itemId);
  list.unshift(itemId);
  if(list.length>MAX_HISTORY) list.pop();
  saveHistory(list);
  renderSideHistory();
}

function renderSideHistory(){
  const list = getHistory();
  if(list.length ===0){
    sideHistoryContent.innerHTML = `<div class="side-empty">暂无记录</div>`;
    return;
  }
  let html = "";
  list.forEach(id=>{
    html += `<div class="side-history-item" data-id="${id}">KWID：${id}</div>`;
  })
  sideHistoryContent.innerHTML = html;
  document.querySelectorAll(".side-history-item").forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.id;
      inputBox.value = id;
      loadMusic();
      historySidebar.classList.remove('open');
    }
  })
}

sideClearHistory.onclick = ()=>{
  localStorage.removeItem(HISTORY_KEY);
  renderSideHistory();
};

function getKuwoId(str){
  const regLink = /yinyue\/(\d+)/;
  const matchLink = str.match(regLink);
  if(matchLink) return matchLink[1];
  if(/^\d+$/.test(str.trim())){
    return str.trim();
  }
  return null;
}
function parseKuwoLyric(jsonData){
  lyricList = [];
  if(!jsonData || !jsonData.data || !Array.isArray(jsonData.data.lrclist)){
    lyricWrap.innerHTML = `<div class="lyric-line">暂无歌词</div>`;
    return;
  }
  jsonData.data.lrclist.forEach(item=>{
    const time = parseFloat(item.time);
    const text = item.lineLyric.trim();
    if(text){
      lyricList.push({time, text});
    }
  })
  lyricList.sort((a,b)=>a.time - b.time);
  renderLyricHtml();
}

function renderLyricHtml(){
  let html = "";
  lyricList.forEach((item,index)=>{
    html += `<div class="lyric-line" data-time="${item.time}" data-idx="${index}">${item.text}</div>`
  })
  lyricWrap.innerHTML = html;
  document.querySelectorAll(".lyric-line").forEach(line=>{
    line.onclick = function(){
      const t = parseFloat(this.dataset.time);
      audioPlayer.currentTime = t;
      audioPlayer.play().catch(e=>{});
      //点击歌词行，滚动该行到容器正中间
      const lineTop = this.offsetTop;
      const wrapH = lyricWrap.clientHeight;
      const lineH = this.clientHeight;
      const targetTop = lineTop - wrapH / 2 + lineH / 2;
      lyricWrap.scrollTo({top:targetTop, behavior:'smooth'});
    }
  })
}

function updateLyric(){
  const currentTime = audioPlayer.currentTime;
  let activeIndex = 0;
  for(let i=0;i<lyricList.length;i++){
    if(currentTime >= lyricList[i].time){
      activeIndex = i;
    }else{
      break;
    }
  }
  const lines = lyricWrap.querySelectorAll('.lyric-line');
  lines.forEach((line,idx)=>{
    line.classList.remove('active');
    if(idx === activeIndex){
      line.classList.add('active');
      // 用户没有手动滑动歌词 → 将高亮歌词计算并滚动至容器正中间
      if(!isUserScrolling){
        const lineTop = line.offsetTop;
        const wrapH = lyricWrap.clientHeight;
        const lineH = line.clientHeight;
        const targetTop = lineTop - wrapH / 2 + lineH / 2;
        lyricWrap.scrollTo({top:targetTop, behavior:'smooth'});
      }
    }
  })
}

async function getLyric(musicId){
  try{
    const lyricApi = `https://www.kuwo.cn/openapi/v1/www/lyric/getlyric?musicId=${musicId}`;
    const resp = await fetch(lyricApi);
    const lyricJson = await resp.json();
    parseKuwoLyric(lyricJson);
  }catch(e){
    lyricWrap.innerHTML = `<div class="lyric-line">歌词获取失败(跨域)</div>`;
    lyricList = [];
  }
}
async function loadMusic(){
  const raw = inputBox.value.trim();
  infoCard.style.display = "none";
  errorBox.style.display = "none";
  loadingBox.style.display = "block";
  lyricWrap.innerHTML = `<div class="lyric-line">加载歌词中...</div>`;
  lyricList = [];
  isUserScrolling = false;
  clearTimeout(scrollTimer);

  audioUrlWrap.style.display = "none";
  audioPlayer.style.display = "none";
  bottomBar.style.display = "none";

  const songId = getKuwoId(raw);
  if(!songId){
    loadingBox.style.display = "none";
    errorBox.textContent = "❌ 识别失败，请输入KW音乐ID或KW分享链接";
    errorBox.style.display = "block";
    return;
  }
  try{
    const apiUrl = `https://musicapi.haitangw.net/music/kw.php?type=json&id=${songId}&level=320k`;
    const res = await fetch(apiUrl);
    const jsonData = await res.json();
    loadingBox.style.display = "none";
    if(!jsonData || !jsonData.data || !jsonData.data.url){
      errorBox.textContent = "❌ 解析失败，未找到data内的url音乐链接";
      errorBox.style.display = "block";
      return;
    }
    songUrl = jsonData.data.url;
    getLyric(songId);
    addHistory(songId);

    audioUrlBox.innerText = `歌曲链接：${songUrl}`;
    audioUrlWrap.style.display = "block";

    audioPlayer.src = songUrl;
    infoCard.style.display = "flex";
    audioPlayer.style.display = "block";
    bottomBar.style.display = "block";

    audioPlayer.play().catch(e=>{});
  }catch(err){
    loadingBox.style.display = "none";
    errorBox.textContent = "❌ 网络请求失败："+err.message;
    errorBox.style.display = "block";
  }
}

downloadBtn.onclick = function(){
  if(!songUrl){
    alert("暂无音频链接");
    return;
  }
  const a = document.createElement("a");
  a.href = songUrl;
  a.download = "music.mp3";
  document.body.appendChild(a);
  a.click();
  a.remove();
};
copyUrlBtn.onclick = async ()=>{
  if(!songUrl){
    alert("暂无音频链接");
    return;
  }
  try{
    await navigator.clipboard.writeText(songUrl);
    alert("✅ 歌曲链接复制成功");
  }catch(e){
    alert("复制失败，请手动选中链接复制");
  }
}
audioPlayer.ontimeupdate = function(){
  if(lyricList.length>0){
    updateLyric();
  }
}
parseBtn.onclick = loadMusic;
inputBox.addEventListener('keydown', e=>{
  if(e.key === 'Enter') loadMusic();
})
renderSideHistory();
</script>
</body>
</html>
