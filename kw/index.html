<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 移动端视口设置：禁止缩放，适配刘海屏 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KW解析</title>
<style>
/**
 * 全局重置样式
 * *：全部元素盒模型统一，清除默认内外边距，设置系统无衬线字体
 */
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}

/**
 * html、body页面根容器
 * 100dvh：适配手机刘海真实视口高度；overflow:hidden 禁止页面整体滚动，全部使用内部局部滚动
 * 深色主题背景，全局文字白色
 */
html,body{
  height:100%;
  height:100dvh;
  overflow:hidden;
  background: #121212;
  color:#fff;
}

/**
 * wrap 最外层总包裹容器
 * flex纵向布局，占满整个屏幕，所有子模块纵向排列
 */
.wrap{
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
  width:100%;
}

/**
 * search-wrap：【顶部搜索栏区域】
 * 包含：历史按钮、输入框、解析按钮，横向flex布局，固定高度不参与滚动
 */
.search-wrap{
  flex:0 0 auto; /* 高度固定，不压缩不拉伸 */
  display:flex;
  gap:6px; /* 子元素之间间距 */
  padding:12px;
  width:100%;
}

/**
 * #inputBox 顶部搜索输入框
 * flex:1 自动占满剩余宽度；圆角胶囊样式，深色背景，居中占位文字
 */
#inputBox{
  flex:1 1 auto;
  min-width:0;
  padding:12px 14px;
  border-radius:30px; /* 大圆角胶囊 */
  border:none;
  background:#222;
  color:#fff;
  font-size:16px;
  outline:none;
  text-align:center;
}

/**
 * #parseBtn 解析按钮（蓝色胶囊按钮）
 * 不允许换行，固定最小高度保证移动端点击热区
 */
#parseBtn{
  padding:0 12px;
  border:none;
  border-radius:30px;
  background:#2593fc; /* 主题蓝色 */
  color:#fff;
  font-size:14px;
  cursor:pointer;
  white-space:nowrap;
  min-height:44px; /* 移动端最小点击高度，防止点不到 */
  flex-shrink:0;
}
#parseBtn:active{opacity:0.8} /* 点击按压变暗效果 */

/**
 * #toggleSideBtn 打开历史侧边栏按钮（灰色胶囊）
 */
#toggleSideBtn{
  padding:0 10px;
  border:none;
  border-radius:30px;
  background:#444;
  color:#fff;
  cursor:pointer;
  white-space:nowrap;
  min-height:44px;
  font-size:14px;
  flex-shrink:0;
}
#toggleSideBtn:active{opacity:0.85;}

/* ----------------【输入框下方：音频链接显示区域】---------------- */
/* audio-url-fixed-wrap：音频链接盒子，固定在搜索栏下方，不随内容滚动，默认隐藏display:none */
.audio-url-fixed-wrap{
  flex:0 0 auto;
  padding:0 12px 8px;
  width:100%;
  display:none;
}
/* #audioUrlBox 展示原始音频url文本盒子，自动换行长链接，小字灰色 */
#audioUrlBox{
  max-width:620px; /* 大屏最大宽度，居中 */
  margin:0 auto;
  width:100%;
  font-size:12px;
  color:#999;
  word-break:break-all; /*长链接强制换行，避免溢出屏幕*/
  background:#2a2a2a;
  padding:8px;
  border-radius:8px;
}

/* ==================== 【历史记录侧边栏UI样式】==================== */
/**
 * history-sidebar：左侧滑出历史侧边栏
 * fixed固定全屏高度；transform位移实现侧滑动画；默认移出屏幕外 translateX(-100%)
 * open类通过js加上，位移归0，显示侧边栏
 */
.history-sidebar{
  position:fixed;
  top:0;
  left:0;
  height:100%;
  height:100dvh;
  width:25vw; /* pc端占屏幕25%宽度 */
  max-width:320px; /* pc最大宽度限制 */
  min-width:220px;
  background:#1a1a1a;
  border-right:1px solid #333;
  z-index:999; /*最高层级，盖过其他页面*/
  transform: translateX(-100%); /* 默认隐藏，向左移出屏幕 */
  transition: transform 0.3s ease; /*平滑侧滑动画0.3秒*/
  padding:16px;
  display:flex;
  flex-direction:column;
}
/* open类：JS切换这个class，侧边栏滑入显示 */
.history-sidebar.open{
  transform: translateX(0);
}
/* 手机屏幕768px以下：侧边栏占屏幕85vw，几乎全屏侧边抽屉 */
@media (max-width:768px){
  .history-sidebar{
    width:85vw;
    max-width:none;
  }
}

/* side-header：侧边栏头部【标题+清空+关闭按钮】横向布局 */
.side-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  gap:8px;
}
.side-header h3{
  font-size:16px;
  color:#eee;
}
#sideClearHistory{
  color:#ff6b6b; /*红色清空文字*/
  font-size:14px;
  cursor:pointer;
  white-space:nowrap;
}
#sideCloseBtn{
  color:#aaa;
  cursor:pointer;
  font-size:22px;
  margin-left:8px;
}

/* side-history-wrap：历史记录列表容器，flex:1占剩余高度，内部可以滚动 */
.side-history-wrap{
  flex:1;
  overflow-y:auto;
}
/* side-history-item：单条历史记录条目 */
.side-history-item{
  padding:12px 6px;
  border-bottom:1px solid #303030; /*分割线*/
  cursor:pointer;
  color:#ccc;
  font-size:14px;
  min-height:44px; /*保证点击区域*/
}
.side-history-item:hover{
  color:#fff;
  background:#272727; /*hover高亮背景，pc端生效*/
}
/* side-empty：历史记录为空提示文字 */
.side-empty{
  text-align:center;
  color:#777;
  padding:30px 0;
}

/* ====================【主内容显示区域】==================== */
/**
 * main-content：中间主体内容容器（歌词区域父盒子）
 * flex:1 占据搜索栏、底部按钮之外剩下全部空间，overflow:hidden，自身不滚动，内容内部滚动
 */
.wrap{
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
  width:100%;
}

.main-content{
  flex:1;
  min-height:0; /* ✅链条第一层必须加 */
  width:100%;
  padding:0 12px;
  overflow:hidden;
}
.container{
  max-width:620px;
  margin:0 auto;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  min-height:0; /* ✅链条第二层必须加 */
  /* ❗删除之前的 margin‑bottom:130px，禁止用外边距压缩flex子内容 */
}

.info-card{
  background:#1e1e1e;
  border-radius:16px;
  padding:16px;
  display:none;
  flex-direction:column;
  flex:1;
  min-height:0; /* ✅链条第三层必须加 */
  width:100%;
  overflow:hidden;
  box-sizing:border-box;
}

.lyric-box{
  flex:1;
  min-height:0; /* ✅链条第四层必须加 */
  box-sizing:border-box;
  background:#222;
  border-radius:12px;
  padding:20px; /* 你要求的盒子内边距20 */
  overflow:hidden;
  position:relative;
}

.lyric-wrap{
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 100px; /* ✅歌词内部底部预留大片留白，滚动到底能看到最后全部歌词，不会贴底；数字可以微调 */
}

.lyric-line{
  text-align:center;
  padding:10px 0;
  color:#aaa;
  font-size:15px;
  cursor:pointer;
}

.lyric-line.active{
  color:#ff3333;  /* 亮红色高亮 */
  font-size:20px;
  font-weight:bold;
}





/* ==========【底部按钮栏：单曲循环/下载/复制链接】固定悬浮在播放器上方 ========== */
/**
 * fixed-bottom-bar 底部悬浮按钮条 fixed固定到底部
 * calc计算位置：播放器高度70px + 安全区域；默认隐藏display:none
 * env(safe-area-inset-bottom)适配手机底部小黑条/刘海安全区
 */
.fixed-bottom-bar{
  position:fixed;
  bottom: calc(70px + env(safe-area-inset-bottom));
  left:0;
  width:100%;
  padding:10px 12px;
  background:#121212;
  display:none;
  z-index:99; /*层级高于播放器，低于侧边栏*/
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}
/* btn-row 三个按钮横向均分flex容器，最大宽度居中 */
.btn-row{
  display:flex;
  gap:8px;
  max-width:620px;
  margin:0 auto;
  width:100%;
}
/* 三个功能按钮：均分宽度flex:1，统一最小点击高度 */
.dl-btn,.copy-url-btn,.loop-btn{
  flex:1;
  padding:12px 4px;
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:14px;
  cursor:pointer;
  min-height:44px;
}
.loop-btn{
  background:#f39c12; /*橙色：单曲循环按钮*/
}
.dl-btn{
  background:#27ae60; /*绿色：下载按钮*/
}
.copy-url-btn{
  background:#9b59b6; /*紫色：复制链接按钮*/
}
/* 按钮点击按压透明度 */
.dl-btn:active,.copy-url-btn:active,.loop-btn:active{opacity:0.8}

/* ==========【原生audio播放器UI，悬浮页面最底部】========== */
/**
 * #audioPlayer html原生播放器控件 fixed固定页面最底部居中
 * calc(10px + 安全距离)；max-width大屏限制620px；默认display:none，解析成功显示
 */
#audioPlayer{
  position:fixed;
  bottom: calc(10px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:620px;
  z-index:98; /*层级比按钮栏低，按钮栏浮在播放器上面*/
  display:none;
}

/* loading：加载提示文字，解析中显示 */
.loading{
  text-align:center;
  padding:30px;
  font-size:16px;
  color:#ccc;
}
/* error：错误提示文本，红色居中 */
.error{
  color:#ff5555;
  text-align:center;
  padding:20px;
}

/* ----------------【小屏幕手机 480px以下 响应式微调UI】---------------- */
@media (max-width:480px){
  .search-wrap{
    gap:6px;
    padding:10px;
  }
  #inputBox{
    padding:11px 12px;
    font-size:15px;
  }
  .info-card{
    padding:12px;
  }
  .btn-row{
    gap:6px;
  }
  .dl-btn,.copy-url-btn,.loop-btn{
    font-size:13px;
    padding:10px 2px;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <!-- =====================【顶部搜索行UI】=====================
       包含：打开历史侧边栏按钮📜历史、输入框、解析按钮
       class="search-wrap" 对应css顶部搜索栏样式
   -->
  <div class="search-wrap">
    <button id="toggleSideBtn">📜历史</button>
    <input id="inputBox" placeholder="KW音乐ID/分享的链接">
    <button id="parseBtn">解析</button>
  </div>

  <!-- ✅【搜索栏下方：解析出来的原始音频链接展示区域】
       默认隐藏；解析歌曲成功后显示，展示完整mp3链接文本
  -->
  <div class="audio-url-fixed-wrap" id="audioUrlWrap">
    <div id="audioUrlBox"></div>
  </div>

  <!-- =====================【左侧滑抽屉：播放历史侧边栏UI】=====================
       class="history-sidebar" 默认移出屏幕；js添加class="open"后滑入显示
       side-header：侧边栏头部：标题 + 清空按钮 +关闭按钮
       side-history-wrap：历史记录列表滚动容器
  -->
  <div class="history-sidebar" id="historySidebar">
    <div class="side-header">
      <h3>历史</h3>
      <div>
        <span id="sideClearHistory">清空</span>
        <span id="sideCloseBtn">◀||</span>
      </div>
    </div>
    <div class="side-history-wrap" id="sideHistoryContent">
      <!-- JS动态渲染 <div class="side-history-item">历史条目</div> -->
    </div>
  </div>

  <!-- =====================【中间主内容区域】=====================
       loadingBox：正在解析加载提示
       errorBox：解析失败错误提示
       infoCard：歌词卡片容器
         └ lyric-box：歌词外框
             └ lyric-wrap：歌词滚动容器，js动态填充每一行.lyric-line歌词DOM
  -->
  <div class="main-content">
    <div class="container">
      <div id="loadingBox" class="loading" style="display:none;">正在解析...</div>
      <div id="errorBox" class="error" style="display:none;"></div>
      <div id="infoCard" class="info-card">
        <div class="lyric-box">
          <div class="lyric-wrap" id="lyricWrap"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- =====================【底部悬浮功能按钮栏UI】=====================
       fixed-bottom-bar fixed悬浮，位于播放器上方
       三个按钮：loopBtn单曲循环、downloadBtn下载、copyUrlBtn复制链接
       默认隐藏，解析歌曲成功display显示
  -->
  <div class="fixed-bottom-bar" id="bottomBar">
    <div class="btn-row">
      <button id="loopBtn" class="loop-btn">单曲循环</button>
      <button id="downloadBtn" class="dl-btn">下载</button>
      <button id="copyUrlBtn" class="copy-url-btn">链接</button>
    </div>
  </div>

  <!-- =====================【原生HTML音频播放器控件UI】=====================
       fixed悬浮页面最底部；层级z-index:98，在按钮栏的下方
       默认隐藏；解析成功才显示出来，提供系统播放进度条
  -->
  <audio id="audioPlayer" controls>
</div>
<script>
const inputBox = document.getElementById('inputBox');
const parseBtn = document.getElementById('parseBtn');
const infoCard = document.getElementById('infoCard');
const loadingBox = document.getElementById('loadingBox');
const errorBox = document.getElementById('errorBox');
const audioUrlBox = document.getElementById('audioUrlBox');
const audioUrlWrap = document.getElementById('audioUrlWrap');
const audioPlayer = document.getElementById('audioPlayer');
const downloadBtn = document.getElementById('downloadBtn');
const copyUrlBtn = document.getElementById('copyUrlBtn');
const lyricWrap = document.getElementById('lyricWrap');
const loopBtn = document.getElementById('loopBtn');
const bottomBar = document.getElementById('bottomBar');
const toggleSideBtn = document.getElementById('toggleSideBtn');
const historySidebar = document.getElementById('historySidebar');
const sideHistoryContent = document.getElementById('sideHistoryContent');
const sideClearHistory = document.getElementById('sideClearHistory');
const sideCloseBtn = document.getElementById('sideCloseBtn');

// 全局业务变量
let songUrl = ""; // 当前歌曲音频真实url
let lyricList = []; //解析后的歌词数组 [{time:秒数,text:"歌词文本"}]
//循环模式：0=单曲循环，1=不循环，2=历史列表循环
let loopMode = 0;
let historyPlayIndex = 0; //历史列表播放下标
let isUserScrolling = false; //标记用户是否手动滑动歌词（手动滑动就禁止自动跟随滚动歌词）
let scrollTimer = null; //歌词滚动防抖计时器
const HISTORY_KEY = "kuwo_music_history"; //localStorage存储历史记录key
const MAX_HISTORY = 50; //最大保存历史记录条数

//【UI交互：打开/关闭历史侧边抽屉】
toggleSideBtn.onclick = ()=>{
  historySidebar.classList.toggle('open');
  renderSideHistory();
};
sideCloseBtn.onclick = ()=>{
  historySidebar.classList.remove('open');
};

//监听歌词容器滚动：标记用户手动滑动歌词
lyricWrap.addEventListener('scroll',()=>{
  isUserScrolling = true;
  clearTimeout(scrollTimer);
});
lyricWrap.addEventListener('scrollend',()=>{
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(()=>{
    isUserScrolling = false; //停止滚动800ms后恢复自动跟随歌词
  },800);
});

//【UI交互：循环模式三态切换按钮 单曲循环→不循环→历史列表循环】
loopBtn.onclick = ()=>{
  loopMode = (loopMode + 1) % 3;
  switch(loopMode){
    case 0:
      loopBtn.textContent = "单曲循环";
      break;
    case 1:
      loopBtn.textContent = "不循环";
      break;
    case 2:
      loopBtn.textContent = "历史列表循环";
      //开启列表循环，重置下标
      const historyList = getHistory();
      if(historyList.length === 0){
        alert("暂无播放历史，无法开启历史列表循环");
        loopMode = 0;
        loopBtn.textContent = "单曲循环";
        return;
      }
      const currId = inputBox.value.trim();
      historyPlayIndex = historyList.findIndex(item=> item === currId);
      if(historyPlayIndex = -1) historyPlayIndex = 0;
      break;
  }
};

//音频播放结束事件，根据loopMode执行不同逻辑
audioPlayer.addEventListener('ended', async ()=>{
  switch(loopMode){
    case 0:
      //单曲循环
      audioPlayer.currentTime = 0;
      audioPlayer.play().catch(e=>{});
      break;
    case 1:
      //不循环，停止
      break;
    case 2:
      //历史列表循环模式
      const historyList = getHistory();
      if(!historyList || historyList.length === 0){
        loopMode = 0;
        loopBtn.textContent = "单曲循环";
        return;
      }
      historyPlayIndex += 1;
      if(historyPlayIndex >= historyList.length){
        historyPlayIndex = 0;
      }
      //加载下一首历史id
      inputBox.value = historyList[historyPlayIndex];
      await loadMusic();
      break;
  }
});

//localStorage读取播放历史
function getHistory(){
  const str = localStorage.getItem(HISTORY_KEY);
  return str ? JSON.parse(str) : [];
}
//保存历史数组到本地存储
function saveHistory(list){
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
}
//新增一条播放历史，去重，最多MAX_HISTORY条
function addHistory(itemId){
  let list = getHistory();
  list = list.filter(i=>i !== itemId);
  list.unshift(itemId);
  if(list.length>MAX_HISTORY) list.pop();
  saveHistory(list);
  renderSideHistory();
}
//【UI渲染：渲染侧边栏历史DOM】
function renderSideHistory(){
  const list = getHistory();
  if(list.length ===0){
    sideHistoryContent.innerHTML = `<div class="side-empty">暂无记录</div>`;
    return;
  }
  let html = "";
  list.forEach(id=>{
    html += `<div class="side-history-item" data-id="${id}">KWID：${id}</div>`;
  })
  sideHistoryContent.innerHTML = html;
  document.querySelectorAll(".side-history-item").forEach((el, idx)=>{
    el.onclick = ()=>{
      const id = el.dataset.id;
      inputBox.value = id;
      // 不再退出历史列表循环；直接把播放下标设置为点击条目的索引
      historyPlayIndex = idx;
      loadMusic();
      historySidebar.classList.remove('open');
    }
  })
}
//清空历史按钮点击事件
sideClearHistory.onclick = ()=>{
  localStorage.removeItem(HISTORY_KEY);
  renderSideHistory();
};

//从输入文本提取酷我音乐ID，支持完整链接或者纯数字id
function getKuwoId(str){
  const regLink = /yinyue\/(\d+)/;
  const matchLink = str.match(regLink);
  if(matchLink) return matchLink[1];
  if(/^\d+$/.test(str.trim())){
    return str.trim();
  }
  return null;
}

//解析接口返回的歌词json，转成lyricList数组
function parseKuwoLyric(jsonData){
  lyricList = [];
  if(!jsonData || !jsonData.data || !Array.isArray(jsonData.data.lrclist)){
    lyricWrap.innerHTML = `<div class="lyric-line">暂无歌词</div>`;
    return;
  }
  jsonData.data.lrclist.forEach(item=>{
    const time = parseFloat(item.time);
    const text = item.lineLyric.trim();
    if(text){
      lyricList.push({time, text});
    }
  })
  lyricList.sort((a,b)=>a.time - b.time);
  renderLyricHtml();
}

//【UI渲染：生成每一行歌词DOM插入页面】
function renderLyricHtml(){
  let html = "";
  lyricList.forEach((item,index)=>{
    html += `<div class="lyric-line" data-time="${item.time}" data-idx="${index}">${item.text}</div>`
  })
  lyricWrap.innerHTML = html;
  document.querySelectorAll(".lyric-line").forEach(line=>{
    line.onclick = function(){
      const t = parseFloat(this.dataset.time);
      audioPlayer.currentTime = t;
      audioPlayer.play().catch(e=>{});
      //点击歌词行，滚动该行到容器正中间
      const lineTop = this.offsetTop;
      const wrapH = lyricWrap.clientHeight;
      const lineH = this.clientHeight;
      const targetTop = lineTop - wrapH / 2 + lineH / 2;
      lyricWrap.scrollTo({top:targetTop, behavior:'smooth'});
    }
  })
}

//【UI更新：根据播放器当前时间，高亮对应歌词行，自动滚动歌词】
function updateLyric(){
  const currentTime = audioPlayer.currentTime;
  let activeIndex = 0;
  for(let i=0;i<lyricList.length;i++){
    if(currentTime >= lyricList[i].time){
      activeIndex = i;
    }else{
      break;
    }
  }
  const lines = lyricWrap.querySelectorAll('.lyric-line');
  lines.forEach((line,idx)=>{
    line.classList.remove('active');
    if(idx === activeIndex){
      line.classList.add('active');
      // 用户没有手动滑动歌词 → 将高亮歌词计算并滚动至容器正中间
      if(!isUserScrolling){
        const lineTop = line.offsetTop;
        const wrapH = lyricWrap.clientHeight;
        const lineH = line.clientHeight;
        const targetTop = lineTop - wrapH / 2 + lineH / 2;
        lyricWrap.scrollTo({top:targetTop, behavior:'smooth'});
      }
    }
  })
}

//网络请求获取歌词
async function getLyric(musicId){
  try{
    const lyricApi = `https://www.kuwo.cn/openapi/v1/www/lyric/getlyric?musicId=${musicId}`;
    const resp = await fetch(lyricApi);
    const lyricJson = await resp.json();
    parseKuwoLyric(lyricJson);
  }catch(e){
    lyricWrap.innerHTML = `<div class="lyric-line">歌词获取失败(跨域)</div>`;
    lyricList = [];
  }
}

//【核心解析加载歌曲函数】
async function loadMusic(){
  const raw = inputBox.value.trim();
  infoCard.style.display = "none";
  errorBox.style.display = "none";
  loadingBox.style.display = "block";
  lyricWrap.innerHTML = `<div class="lyric-line">加载歌词中...</div>`;
  lyricList = [];
  isUserScrolling = false;
  clearTimeout(scrollTimer);
  audioUrlWrap.style.display = "none";
  audioPlayer.style.display = "none";
  bottomBar.style.display = "none";
  const songId = getKuwoId(raw);
  if(!songId){
    loadingBox.style.display = "none";
    errorBox.textContent = "❌ 识别失败，请输入KW音乐ID或KW分享链接";
    errorBox.style.display = "block";
    return;
  }
  try{
    const apiUrl = `https://musicapi.haitangw.net/music/kw.php?type=json&id=${songId}&level=320k`;
    const res = await fetch(apiUrl);
    const jsonData = await res.json();
    loadingBox.style.display = "none";
    if(!jsonData || !jsonData.data || !jsonData.data.url){
      errorBox.textContent = "❌ 解析失败，未找到data内的url音乐链接";
      errorBox.style.display = "block";
      return;
    }
    songUrl = jsonData.data.url;
    getLyric(songId);
    addHistory(songId);
    audioUrlBox.innerText = `歌曲链接：${songUrl}`;
    audioUrlWrap.style.display = "block";
    audioPlayer.src = songUrl;
    infoCard.style.display = "flex";
    audioPlayer.style.display = "block";
    bottomBar.style.display = "block";
    audioPlayer.play().catch(e=>{});
  }catch(err){
    loadingBox.style.display = "none";
    errorBox.textContent = "❌ 网络请求失败："+err.message;
    errorBox.style.display = "block";
  }
}

//下载按钮点击事件，a标签模拟下载
downloadBtn.onclick = function(){
  if(!songUrl){
    alert("暂无音频链接");
    return;
  }
  const a = document.createElement("a");
  a.href = songUrl;
  a.download = "music.mp3";
  document.body.appendChild(a);
  a.click();
  a.remove();
};

//复制链接按钮，剪贴板复制音频url
copyUrlBtn.onclick = async ()=>{
  if(!songUrl){
    alert("暂无音频链接");
    return;
  }
  try{
    await navigator.clipboard.writeText(songUrl);
    alert("✅ 歌曲链接复制成功");
  }catch(e){
    alert("复制失败，请手动选中链接复制");
  }
}

//播放器时间更新回调，每一帧更新歌词高亮UI
audioPlayer.ontimeupdate = function(){
  if(lyricList.length>0){
    updateLyric();
  }
}

//点击解析按钮触发解析
parseBtn.onclick = function(){
  //手动点击解析按钮，退出历史列表循环
  loopMode = 0;
  loopBtn.textContent = "单曲循环";
  loadMusic();
};

//输入框回车触发解析
inputBox.addEventListener('keydown', e=>{
  if(e.key === 'Enter') {
    loopMode = 0;
    loopBtn.textContent = "单曲循环";
    loadMusic();
  }
})

//页面初始化渲染历史列表
renderSideHistory();
</script>
</body>
</html>
